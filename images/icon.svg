<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Card/List Glow -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Plug Gradient (Connection) -->
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Lease Document Container -->
  <rect x="136" y="90" width="240" height="300" rx="20" fill="none" stroke="url(#cardGrad)" stroke-width="14" stroke-linejoin="round" />
  
  <!-- Document Header lines -->
  <line x1="176" y1="140" x2="336" y2="140" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <line x1="176" y1="180" x2="296" y2="180" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />

  <!-- Lease Entries (represented as list items with checkmarks/locks) -->
  <!-- Entry 1 -->
  <circle cx="186" cy="235" r="10" fill="#34d399" />
  <line x1="216" y1="235" x2="326" y2="235" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Entry 2 -->
  <circle cx="186" cy="285" r="10" fill="#34d399" />
  <line x1="216" y1="285" x2="306" y2="285" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Entry 3 (Static Pin/Lock representation) -->
  <path d="M181 332 h10 v8 h-10 z" fill="#fbbf24" />
  <path d="M183 332 v-4 c0-1.5 1-2.5 3-2.5 s3 1 3 2.5 v4" fill="none" stroke="#fbbf24" stroke-width="2.5" />
  <line x1="216" y1="335" x2="286" y2="335" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />

  <!-- Network Ethernet Plug (overlapped at bottom right) -->
  <g filter="url(#glow)">
    <!-- Plug Base -->
    <rect x="260" y="300" width="130" height="90" rx="10" fill="url(#plugGrad)" />
    <!-- Gold Pins -->
    <rect x="345" y="290" width="8" height="10" fill="#fbbf24" />
    <rect x="357" y="290" width="8" height="10" fill="#fbbf24" />
    <rect x="369" y="290" width="8" height="10" fill="#fbbf24" />
    <rect x="381" y="290" width="8" height="10" fill="#fbbf24" />
    
    <!-- Plug Boot -->
    <path d="M260 330 L220 345 L220 375 L260 360 Z" fill="#047857" />
    <!-- Network Cable -->
    <path d="M220 360 Q120 390 80 430" fill="none" stroke="#047857" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
